[project]
name = "jev-census"
version = "0.1.0"
description = "Ask the same questions of every row in a dataset, and get back a table — built on TypeSafe's Jev."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "pydantic>=2",
    "pyyaml>=6",
    "pyarrow>=17",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.2",
]

[project.scripts]
census = "jev_census.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "duckdb>=1.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The demo corpus, gold set and question set (T7.2) must travel inside the
# wheel or `census demo` fails only for people who installed the package --
# the exact population this phase exists for (06-P7-ADOPTION.md).
jev_census = ["demo_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Typer's CLI parameters are declared as `typer.Option(...)` default values by
# design (it introspects them) — B008 is a false positive here.
"src/jev_census/cli.py" = ["B008"]
